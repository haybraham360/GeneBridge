name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs on every push and PR. Needs no secrets: suites that need Supabase skip themselves.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Copy lint (guardrail 1)
        run: npm run lint:copy
      # PageProps, LayoutProps and image module types are generated by Next.js
      # into gitignored files, so generate them before type checking.
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx next build

  # RLS and end-to-end tests sign in as the demo personas and write data, so they
  # must run against a separate TEST Supabase project, never production.
  # To turn on: add the secrets below for the test project, then set the
  # repository variable RUN_SUPABASE_TESTS to "true".
  supabase:
    if: vars.RUN_SUPABASE_TESTS == 'true'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Seed demo personas and results
        run: npm run seed:auth && npm run seed:results
      - name: RLS tests
        run: npm run test:rls
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
