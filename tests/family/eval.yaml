- id: ar-sister-son
  lang: ar
  turns: ["ابن أختي أصم"]
  expect:
    people:
      - { relation: nephew }
    allow: [sister]
    conditions:
      - { person: nephew, other: true, status: not_sure, suggest: gjb2_hearing_loss }

- id: ar-grandfather
  lang: ar
  turns: ["جدي أبو أبي كان عنده ضمور العضلات الشوكي"]
  expect:
    people:
      - { relation: grandfather, side: paternal }
