      - { relation: husband }
      - { relation: uncle, side: maternal }
    allow: [mother]
    links:
      - { parent: uncle, child: husband }
    cousins: true
    conditions:
      - { person: uncle, condition: sickle_cell_disease, status: known }
    no_side_question: true

- id: ar-aunt-carrier
